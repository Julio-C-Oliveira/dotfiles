[bar/top_secondary]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 7

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = MesloLGS NF:size=12;1
font-1 = Noto Color Emoji:size=12;1 
font-2 = FiraCode Nerd Font:size=12;1

modules-left = bspwm xwindow
modules-center = 
modules-right = date battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
