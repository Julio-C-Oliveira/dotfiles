[module/pomodoro]
type = custom/script
exec = ~/dotfiles/scripts/pomodoro.py status
interval = 1

format = <label>
label = %output%

click-left = ~/dotfiles/scripts/pomodoro.py toggle
click-right = ~/dotfiles/scripts/pomodoro.py stop
click-middle = ~/dotfiles/scripts/windows/pomodoro_menu.py
scroll-up = ~/dotfiles/scripts/pomodoro.py skip
scroll-down = ~/dotfiles/scripts/pomodoro.py toggle
